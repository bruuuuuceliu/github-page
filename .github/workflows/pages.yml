name: Deploy GitHub project page

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site and contribution sync
        run: |
          npm run check
          python3 scripts/test_activity.py
      - name: Refresh profile-wide GitHub contribution snapshot
        env:
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: |
          if [ -n "$ACTIVITY_TOKEN" ]; then
            python3 scripts/update-activity.py
          else
            if python3 -c "import json; from pathlib import Path; assert json.loads(Path('site/activity.json').read_text()).get('scope') == 'account'"; then
              echo 'Keeping authenticated snapshot; configure a read:user ACTIVITY_TOKEN for automatic private-count updates.'
            else
              python3 scripts/update-activity.py --public
            fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
